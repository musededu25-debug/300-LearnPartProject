<!DOCTYPE html>
<html lang="en">

<!-- 使用内部样式表。  创建一个 div，赋予它一个合理的 class 类名，表示“通知横幅”。 
  在 div 内部放一个 p 标签，内容为：“系统将于今晚 24:00 进行停机维护。”。
  利用 class 选择器，给这个 div 设置一个背景颜色（请使用十六进制颜色值 HEX）。
 利用标签选择器，让 p 标签内的文字颜色变为白色（请使用英语单词定义颜色）。  
  -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        div{
            background-color:#ec2b24;
        }
         /* color: ec2b24; */
        .notion{
            p{
                color: white;
            }
        }
    </style>
</head>
<body>

    

    <div class="notion">
        <p>系统将于今晚24:00进行停机维护</p>
    </div>
    
</body>
</html>
