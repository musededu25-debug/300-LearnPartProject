
<!-- 
    1.创建标准的 HTML5 网页结构。

    2.在网页主体中添加一个一级标题，文字为“我的前端学习日记”。

    3.添加一个段落，写一句简单的自我介绍。在这个段落中，将你的名字用标签加粗，将你的目标（例如“学好HTML”）用标签倾斜。

    4.在段落下方添加一条水平分隔线。
-->

<!-- 创建结构 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!--2. 创建一级标题 -->
    <h1>我的前端学习笔记</h1>


    <!-- 3.自我介绍段落 -->
     <p>
        我是一个大学生，目前在学习HTML，我叫
        <strong>
            M
        </strong>
        我的目标是
        <em>学好HTML</em>

     </p>

     <br>

</body>
</html>
